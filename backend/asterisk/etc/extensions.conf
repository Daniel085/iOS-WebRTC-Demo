; Dialplan for the WebRTC Dialer prototype.
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]

;------------------------------------------------------------------------------
; Calls from app users and browser softphones (app-user endpoints)
;------------------------------------------------------------------------------
[from-app]
; *43 echo test: Phase 1/2 acceptance test. You hear yourself back.
exten => *43,1,NoOp(Echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; *44 playback test: one-way audio from Asterisk (checks DTLS-SRTP and codecs).
exten => *44,1,NoOp(Playback test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

; *45 continuous 1 kHz tone: handy when the microphone is muted or missing.
exten => *45,1,NoOp(Milliwatt from ${CALLERID(num)})
 same => n,Answer()
 same => n,Milliwatt()

; *46 ringing test: 180 Ringing for 8 s, then answer (exercises call-ringing).
exten => *46,1,NoOp(Ringing test from ${CALLERID(num)})
 same => n,Ringing()
 same => n,Wait(8)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Dial another endpoint registered here by name. A browser softphone calling
; user_15550000001 exercises the INBOUND gateway path (SIP -> app incoming-call).
exten => _[a-z].,1,NoOp(Endpoint ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup()

; E.164 numbers: the carrier trunk arrives in Phase 3. Until then reply
; 503 Service Unavailable so the app gets call-error {sipStatus: 503}.
exten => _+X.,1,NoOp(Outbound to ${EXTEN} from ${CALLERID(num)}: no trunk configured yet)
 same => n,Congestion(3)
 same => n,Hangup()
; Phase 3 replaces the two lines above with:
; same => n,Dial(PJSIP/${EXTEN}@trunk,60)

exten => i,1,NoOp(Invalid destination from ${CALLERID(num)})
 same => n,Hangup(1)

;------------------------------------------------------------------------------
; Inbound from the carrier trunk - Phase 4 (DID -> app user -> VoIP push)
;------------------------------------------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(Inbound ${EXTEN} from ${CALLERID(num)}: no DID routing yet)
 same => n,Hangup(1)
; Phase 4:
; same => n,Set(TARGET=${SHELL(curl -s https://api.example.com/internal/did/${EXTEN})})
; same => n,Dial(PJSIP/${TARGET},45)
