; PJSIP configuration for the WebRTC Dialer prototype (docs/SIP_INTEGRATION.md).
;
;   transports : SIP over WebSocket (ws 8088, wss 8089; TLS lives in http.conf)
;   app-user   : template for WebRTC endpoints (app users via the Node gateway,
;                browser softphones for testing)
;   webrtc_test: static endpoint for the JsSIP browser demo
;   #tryinclude pjsip_users.conf : endpoints the backend generates per app user
;   trunk      : Phase 3, not configured yet

[global]
type = global
user_agent = WebRTCDialer-Asterisk
; Identify endpoints by the username in From, as the gateway's Contact hosts
; are the random ".invalid" hosts JsSIP generates.
endpoint_identifier_order = username,ip,anonymous

;------------------------------------------------------------------------------
; Transports
;------------------------------------------------------------------------------
; Plain SIP over WebSocket. The Node gateway uses this when it runs next to
; Asterisk (ASTERISK_WSS_URL=ws://asterisk:8088/ws). Do not expose it publicly.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; SIP over secure WebSocket for browsers/phones. The certificate is configured
; in http.conf (Asterisk's HTTP server terminates TLS for WebSocket transports).
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0
; Asterisk in Docker (bridge network) or behind NAT: advertise the address the
; phones can reach, or ICE candidates carry the container/private IP.
;external_media_address = 192.168.4.20
;external_signaling_address = 192.168.4.20
;local_net = 172.16.0.0/12
;local_net = 192.168.0.0/16
;local_net = 10.0.0.0/8

;------------------------------------------------------------------------------
; WebRTC endpoint templates
;------------------------------------------------------------------------------
[app-user](!)
type = endpoint
context = from-app
disallow = all
allow = opus
allow = ulaw
; webrtc=yes implies: use_avpf, media_encryption=dtls, dtls_verify=fingerprint,
; dtls_setup=actpass, ice_support, media_use_received_transport, rtcp_mux,
; bundle and dtls_auto_generate_cert. Kept explicit where it helps reading.
webrtc = yes
dtls_auto_generate_cert = yes
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
dtmf_mode = rfc4733
language = en

[app-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 0

[app-auth](!)
type = auth
auth_type = userpass

;------------------------------------------------------------------------------
; Static test user for a browser softphone (JsSIP tryit page, sipml5, ...):
;   SIP URI  sip:webrtc_test@<your asterisk host>
;   password webrtc_test_pass
; Remove or change this before Asterisk is reachable from the internet.
;------------------------------------------------------------------------------
[webrtc_test](app-user)
auth = webrtc_test
aors = webrtc_test
callerid = "WebRTC Test" <webrtc_test>

[webrtc_test](app-auth)
username = webrtc_test
password = webrtc_test_pass

[webrtc_test](app-aor)

;------------------------------------------------------------------------------
; App users. backend/src/services/sip-provisioning.js writes one block per
; user into pjsip_users.conf at verify-code time and runs `pjsip reload`
; (over AMI, see manager.conf). The file is gitignored; #tryinclude tolerates
; its absence. Production: PJSIP realtime in Postgres instead of this file.
;------------------------------------------------------------------------------
#tryinclude pjsip_users.conf

