; Module loading for the WebRTC Dialer prototype.
; autoload=yes loads everything the image ships; the explicit `load` lines
; make a missing WebRTC/SIP piece show up as an error at startup instead of
; a silent gap. Modules that need hardware or are unrelated are not loaded.
[modules]
autoload = yes

; SIP (PJSIP) + SIP over WebSocket (RFC 7118)
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_registrar.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_nat.so
load => res_http_websocket.so
load => res_pjsip_transport_websocket.so
load => chan_pjsip.so

; WebRTC media: ICE, DTLS-SRTP, Opus
load => res_rtp_asterisk.so
load => res_srtp.so
load => res_format_attr_opus.so
; codec_opus is Sangoma's binary module (x86_64 Debian/Ubuntu builds include it; some
; images and arm64 do not). It is only needed to TRANSCODE Opus; the echo test (*43)
; passes Opus through untouched. If the log says it is missing, Playback() still works
; when the client also offers ulaw (the app-user template allows ulaw as fallback).
load => codec_opus.so

; Dialplan applications used by extensions.conf
load => pbx_config.so
load => app_echo.so
load => app_playback.so
load => app_milliwatt.so
load => app_dial.so
load => func_callerid.so
load => func_channel.so

; Not wanted in this container
noload => chan_sip.so
noload => chan_dahdi.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_motif.so
noload => chan_iax2.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cel_custom.so
noload => pbx_ael.so
noload => pbx_lua.so
