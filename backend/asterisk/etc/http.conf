; Asterisk's built-in HTTP server carries SIP over WebSocket.
;   ws://host:8088/ws   plain  - used by the Node gateway next to Asterisk (docker network / localhost)
;   wss://host:8089/ws  TLS    - browsers and phones (self-signed cert for the prototype, see ../README.md)
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/fullchain.pem
tlsprivatekey = /etc/asterisk/keys/privkey.pem
enablestatic = no
sessionlimit = 100
