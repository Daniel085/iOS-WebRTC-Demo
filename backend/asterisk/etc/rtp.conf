[general]
; Small RTP range so docker can publish it port-by-port (10000-20000 would be
; thousands of mappings). Raise it for more than ~50 concurrent calls, or run
; the container with network_mode: host on Linux.
rtpstart = 10000
rtpend = 10100

; ICE is mandatory for WebRTC endpoints (webrtc=yes turns it on per endpoint;
; this is the global switch and STUN lets Asterisk learn its public address).
icesupport = yes
stunaddr = stun.l.google.com:19302

; When Asterisk runs in a Docker bridge network, its host candidates carry the
; container IP, which phones on your LAN cannot reach. Map them to the Docker
; host's IP here (see ../README.md "NAT and Docker"):
;[ice_host_candidates]
;172.18.0.3 => 192.168.4.20
