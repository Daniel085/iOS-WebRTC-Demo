; Asterisk Manager Interface. The Node backend uses it only to run
; `pjsip reload` after provisioning a user (src/services/sip-provisioning.js).
; Change the secret (and ASTERISK_AMI_SECRET in backend/.env) before exposing
; anything; docker-compose publishes 5038 on 127.0.0.1 only.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
webenabled = no
displayconnects = no

[gateway]
secret = change-me-gateway-ami
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,command
write = system,command
