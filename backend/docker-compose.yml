version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: webrtc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-webrtc_dialer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc-network

  # Redis (optional - for production caching)
  redis:
    image: redis:7-alpine
    container_name: webrtc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webrtc-network
    profiles:
      - with-redis

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrtc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-webrtc_dialer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      APN_AUTH_METHOD: ${APN_AUTH_METHOD:-token}
      APN_KEY_PATH: ${APN_KEY_PATH}
      APN_KEY_ID: ${APN_KEY_ID}
      APN_TEAM_ID: ${APN_TEAM_ID}
      VOIP_BUNDLE_ID: ${VOIP_BUNDLE_ID}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SIP gateway (docs/SIP_INTEGRATION.md). The gateway reaches Asterisk over
      # the compose network on the plain WebSocket port; phones use wss://:8089.
      SIP_ENABLED: ${SIP_ENABLED:-false}
      ASTERISK_WSS_URL: ${ASTERISK_WSS_URL:-ws://asterisk:8088/ws}
      ASTERISK_DOMAIN: ${ASTERISK_DOMAIN:-asterisk}
      SIP_GATEWAY_SECRET: ${SIP_GATEWAY_SECRET}
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST:-asterisk}
      ASTERISK_AMI_PORT: 5038
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-gateway}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-change-me-gateway-ami}
      ASTERISK_USERS_CONF: /app/asterisk/etc/pjsip_users.conf
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
      # Shared with the asterisk service: provisioning writes pjsip_users.conf here.
      - ./asterisk/etc:/app/asterisk/etc
    networks:
      - webrtc-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Asterisk: WebRTC <-> SIP media gateway (docs/SIP_INTEGRATION.md, Phase 1-2).
  # Config lives in ./asterisk/etc, TLS certs in ./asterisk/certs (see ./asterisk/README.md).
  #   docker compose up asterisk
  #   docker compose exec asterisk asterisk -rx "pjsip show endpoints"
  asterisk:
    image: andrius/asterisk:22
    container_name: webrtc-asterisk
    restart: unless-stopped
    # Linux hosts can use host networking instead of the port list below, which
    # avoids NAT for RTP entirely:  network_mode: host  (and drop "ports").
    ports:
      - "8088:8088"                      # SIP over WebSocket (plain) - gateway/dev only
      - "8089:8089"                      # SIP over secure WebSocket - browsers, phones
      - "127.0.0.1:5038:5038"            # AMI (pjsip reload) - local backend only
      - "10000-10100:10000-10100/udp"    # RTP (matches rtp.conf)
    volumes:
      - ./asterisk/etc:/etc/asterisk:ro
      - ./asterisk/certs:/etc/asterisk/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' | grep -q Asterisk"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - webrtc-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: webrtc-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - webrtc-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  webrtc-network:
    driver: bridge
